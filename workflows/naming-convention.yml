name: Naming Convention Check

on:
    pull_request:
        types: [opened, edited, synchronize, reopened]

jobs:
    check-naming-convention:
        runs-on: ubuntu-latest
        steps:
            - name: Check naming convention
              uses: actions/checkout@v4
            
            - name: Verify branch naming convention
              run: |
                BRANCH_NAME="${{ github.head_ref }}"
                REGEX="^(feat|feature|fix|docs|refactor|test|chore|build|ci)\/[a-z0-9-]+$"
                if [[ ! $BRANCH_NAME =~ $REGEX ]]; then
                  echo "Branch name '$BRANCH_NAME' does not follow the naming convention."
                  echo "Expected format: <type>/<description-description>"
                  echo "Where <type> is one of: feat, feature, fix, docs, refactor, test, chore, build, ci"
                  echo "And <description> is a lowercase string with words separated by hyphens."
                  exit 1
                else
                  echo "Branch name '$BRANCH_NAME' follows the naming convention."
                fi

            - name: Verify commit messages
              uses: amannn/action-semantic-pull-request@v5
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              with:
                  types: feat, feature, fix, docs, refactor, test, chore, build, ci
                  requireScope: false
