name: Naming Convention Check

on:
  workflow_call:

jobs:
  check-naming-convention:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
            
      - name: Verify Branch Naming
        run: |
          BRANCH_NAME="${{ github.event.pull_request.head.ref }}"
          REGEX="^(feat|feature|fix|docs|refactor|test|chore|build|ci)\/[a-z0-9-]+$"
          
          if [[ ! $BRANCH_NAME =~ $REGEX ]]; then
            echo "::error::Branch name '$BRANCH_NAME' is invalid!"
            echo "Expected: <type>/<description-lowercase-with-hyphens>"
            exit 1
          fi
          echo "Branch name follows the convention."

      - name: Verify PR Title (Semantic)
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            feature
            fix
            docs
            refactor
            test
            chore
            build
            ci
          requireScope: false