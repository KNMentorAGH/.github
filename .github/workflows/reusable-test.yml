name: Reusable Test Runner

on:
  workflow_call:
    secrets:
      token:
        required: true

permissions:
  contents: read
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.token }}

      - name: Detect Technologies
        id: detect
        run: |
          echo "has_csharp=$(find . -maxdepth 2 -name "*.sln" -o -name "*.csproj" | grep -q . && echo 'true' || echo 'false')" >> $GITHUB_OUTPUT
          echo "has_python=$((test -f pyproject.toml || test -f requirements.txt) && echo 'true' || echo 'false')" >> $GITHUB_OUTPUT

      - name: Guard Empty Project
        if: steps.detect.outputs.has_csharp == 'false' && steps.detect.outputs.has_python == 'false'
        run: |
          echo "::warning::No supported technology stack discovered (empty repository structure). Skipping test suites gracefully."
          exit 0

      # --- .NET ---
      - name: Setup .NET
        if: steps.detect.outputs.has_csharp == 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
          cache: true

      - name: Run C# Tests
        if: steps.detect.outputs.has_csharp == 'true'
        run: dotnet test --configuration Release --verbosity normal --collect:"XPlat Code Coverage" --results-directory ./coverage

      # --- PYTHON ---
      - name: Setup Python
        if: steps.detect.outputs.has_python == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        if: steps.detect.outputs.has_python == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f pyproject.toml ]; then pip install .; fi

      - name: Run Python Tests
        if: steps.detect.outputs.has_python == 'true'
        run: |
          PACKAGE_DIR=$(find . -maxdepth 2 -type d -name "*[!test]*" -path "*/test*" -prune -o -type d -name "financial*" -print | head -1)
          TEST_DIR=$(find . -maxdepth 3 -type d -name "tests" -o -type d -name "test" | head -1)
    
          if [ -z "$TEST_DIR" ]; then
          echo "::warning::No tests directory found"
          exit 0
          fi
    
          pytest "$TEST_DIR" --cov=financial_research_platform --cov-report=xml --cov-report=term

      # --- PR Report ---
      - name: Parse Coverage Report
        if: github.event_name == 'pull_request' && always() && steps.detect.outputs.has_python == 'true'
        id: coverage
        run: |
          if [ -f coverage.xml ]; then
            # Extract coverage percentage using Python
            python3 << 'EOF'
            import xml.etree.ElementTree as ET
            tree = ET.parse('coverage.xml')
            root = tree.getroot()
            coverage_pct = root.get('line-rate')
            if coverage_pct:
              coverage_pct = float(coverage_pct) * 100
              print(f"coverage={coverage_pct:.1f}%")
            else:
              print("coverage=N/A")
            EOF
          else
            echo "coverage=N/A"
          fi >> $GITHUB_OUTPUT

      - name: Create Coverage Comment
        if: github.event_name == 'pull_request' && always() && steps.detect.outputs.has_python == 'true'
        run: |
          cat > coverage-comment.md << 'EOF'
          ## Code Coverage Report
          
          Coverage: ${{ steps.coverage.outputs.coverage }}
          
          For detailed coverage, check the workflow logs.
          EOF

      - name: Add Coverage Comment to PR
        if: github.event_name == 'pull_request' && always() && steps.detect.outputs.has_python == 'true'
        run: |
          if [ -f coverage-comment.md ]; then
            gh pr comment ${{ github.event.pull_request.number }} --body-file coverage-comment.md
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.token }}
