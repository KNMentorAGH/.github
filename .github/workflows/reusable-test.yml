name: Reusable Test Runner

on:
  workflow_call:
    secrets:
      token:
        required: true

permissions:
  contents: read
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.token }}

      - name: Check for Config Files
        id: check_files
        run: |
          echo "has_python=$(test -f pyproject.toml && echo 'true' || echo 'false')" >> $GITHUB_OUTPUT
          echo "has_csharp=$(test -f .editorconfig && echo 'true' || echo 'false')" >> $GITHUB_OUTPUT

      # --- .NET ---
      - name: Setup .NET
        if: steps.check_files.outputs.has_csharp == 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Run C# Tests
        if: steps.check_files.outputs.has_csharp == 'true'
        run: dotnet test --configuration Release --verbosity normal

      # --- PYTHON ---
      - name: Setup Python
        if: steps.check_files.outputs.has_python == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        if: steps.check_files.outputs.has_python == 'true'
        run: |
          pip install pytest pytest-cov
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Python Tests (Pytest)
        if: steps.check_files.outputs.has_python == 'true'
        run: pytest --cov=src

      # --- PR Report ---
      - name: Code Coverage Report
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: "**/coverage*.xml"
          badge: true
          fail_below_min: false
          format: markdown
          output: both

      - name: Add Coverage PR Comment
        if: github.event_name == 'pull_request'
        run: gh pr comment ${{ github.event.pull_request.number }} --body-file code-coverage-results.md
        env:
          GITHUB_TOKEN: ${{ secrets.token }}