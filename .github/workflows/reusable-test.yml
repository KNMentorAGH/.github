name: Reusable Test Runner

on:
  workflow_call:
    secrets:
      token:
        required: true

permissions:
  contents: read
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.token }}

      - name: Detect Technologies
        id: detect
        run: |
          echo "has_csharp=$(find . -maxdepth 2 -name "*.sln" -o -name "*.csproj" | grep -q . && echo 'true' || echo 'false')" >> $GITHUB_OUTPUT
          echo "has_python=$(test -f pyproject.toml || test -f requirements.txt && echo 'true' || echo 'false')" >> $GITHUB_OUTPUT

      # --- .NET ---
      - name: Setup .NET
        if: steps.detect.outputs.has_csharp == 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
          cache: true

      - name: Run C# Tests
        if: steps.detect.outputs.has_csharp == 'true'
        run: dotnet test --configuration Release --verbosity normal --collect:"XPlat Code Coverage" --results-directory ./coverage

      # --- PYTHON ---
      - name: Setup Python
        if: steps.detect.outputs.has_python == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        if: steps.detect.outputs.has_python == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f pyproject.toml ]; then pip install .; fi

      - name: Run Python Tests
        if: steps.detect.outputs.has_python == 'true'
        run: pytest --cov=src --cov-report=xml

      # --- PR Report ---
      - name: Generate Coverage Summary
        uses: irongut/CodeCoverageSummary@v1.3.0
        if: always()
        with:
          filename: "**/coverage.xml"
          badge: true
          fail_below_min: false
          format: markdown
          output: both

      - name: Add Coverage Comment to PR
        if: github.event_name == 'pull_request' && always()
        run: |
          # Sprawdzamy czy plik raportu istnieje przed próbą wysłania komentarza
          if [ -f code-coverage-results.md ]; then
            gh pr comment ${{ github.event.pull_request.number }} --body-file code-coverage-results.md
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.token }}