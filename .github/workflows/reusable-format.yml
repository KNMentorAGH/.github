name: Reusable Auto Format

on:
  workflow_call:
    secrets:
      token:
        required: true

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.token }}
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Check for Config Files
        id: check_files
        run: |
          echo "has_python=$(test -f pyproject.toml && echo 'true' || echo 'false')" >> $GITHUB_OUTPUT
          echo "has_csharp=$(test -f .editorconfig && echo 'true' || echo 'false')" >> $GITHUB_OUTPUT

      - name: Format Python (Ruff)
        if: steps.check_files.outputs.has_python == 'true'
        run: |
          pip install ruff
          ruff format .
          ruff check --fix .

      - name: Format C# (dotnet format)
        if: steps.check_files.outputs.has_csharp == 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Run Dotnet Format
        if: steps.check_files.outputs.has_csharp == 'true'
        run: dotnet format

      - name: Commit Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "style: automated code formatting [skip ci]"
          commit_user_name: github-actions[bot]
          commit_user_email: github-actions[bot]@users.noreply.github.com