name: Reusable Auto Format

on:
  workflow_call:
    secrets:
      token:
        required: true

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.token }}

      - name: Detect Technologies
        id: detect
        run: |
          echo "has_csharp=$(find . -maxdepth 2 -name "*.sln" -o -name "*.csproj" | grep -q . && echo 'true' || echo 'false')" >> $GITHUB_OUTPUT
          echo "has_python=$(test -f pyproject.toml || test -f requirements.txt && echo 'true' || echo 'false')" >> $GITHUB_OUTPUT

      # --- PYTHON ---
      - name: Format Python (Ruff)
        if: steps.detect.outputs.has_python == 'true'
        run: |
          pip install ruff
          ruff format .
          ruff check --fix .

      # --- .NET ---
      - name: Setup .NET
        if: steps.detect.outputs.has_csharp == 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Run Dotnet Format
        if: steps.detect.outputs.has_csharp == 'true'
        run: dotnet format

      # --- COMMIT ---
      - name: Commit Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "style: automated code formatting [skip ci]"
          commit_user_name: github-actions[bot]
          commit_user_email: github-actions[bot]@users.noreply.github.com