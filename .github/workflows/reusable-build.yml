name: Reusable Build Check

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Detect Technologies
        id: detect
        run: |
          echo "has_csharp=$(find . -maxdepth 2 -name "*.sln" -o -name "*.csproj" | grep -q . && echo 'true' || echo 'false')" >> $GITHUB_OUTPUT
          echo "has_python=$((test -f pyproject.toml || test -f requirements.txt) && echo 'true' || echo 'false')" >> $GITHUB_OUTPUT

      - name: Guard Empty Project
        if: steps.detect.outputs.has_csharp == 'false' && steps.detect.outputs.has_python == 'false'
        run: |
          echo "::warning::No supported technology stack discovered (empty repository structure). Skipping build tasks gracefully."
          exit 0

      # --- .NET ---
      - name: Setup .NET
        if: steps.detect.outputs.has_csharp == 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
          cache: true

      - name: Restore and Build (C#)
        if: steps.detect.outputs.has_csharp == 'true'
        run: |
          dotnet restore
          dotnet build --no-restore --configuration Release

      # --- PYTHON ---
      - name: Setup Python
        if: steps.detect.outputs.has_python == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install & Syntax Check (Python)
        if: steps.detect.outputs.has_python == 'true'
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f pyproject.toml ]; then pip install .; fi
          python -m compileall .