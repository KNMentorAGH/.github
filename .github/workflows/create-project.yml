name: Create Project from Template

on:
  workflow_dispatch:
    inputs:
      repo_name:
        description: 'Name of the new repository (kebab-case)'
        required: true
      team_name:
        description: 'Slug of the team (e.g. projekt-yennefer)'
        required: true
      project_leader:
        description: 'GitHub Username of the Project Leader (Code Owner)'
        required: true
      visibility:
        type: choice
        description: 'Repository visibility'
        options:
          - public
          - private
        default: public

concurrency:
  group: create-repo-${{ github.event.inputs.repo_name }}
  cancel-in-progress: false

jobs:
  create-and-protect:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    steps:
      - name: Validate Inputs and Check for Duplicates
        run: |
          REPO_LOWER=$(echo "${{ github.event.inputs.repo_name }}" | tr '[:upper:]' '[:lower:]')
          CONTENT=$(printf "* @${{ github.event.inputs.project_leader }}" | base64 -w 0)
          
          gh api --method PUT /repos/KNMentorAGH/$REPO_LOWER/contents/.github/CODEOWNERS \
            -f message="chore: initialize CODEOWNERS [skip ci]" \
            -f content="$CONTENT"
        env:
          GITHUB_TOKEN: ${{ secrets.ORG_ADMIN_TOKEN }}

      - name: Create Repository
        run: |
          REPO_LOWER=$(echo "${{ github.event.inputs.repo_name }}" | tr '[:upper:]' '[:lower:]')
          gh repo create "KNMentorAGH/$REPO_LOWER" \
            --template "KNMentorAGH/template" \
            --${{ github.event.inputs.visibility }}

          for i in {1..30}; do
            if gh repo view "KNMentorAGH/$REPO_LOWER" > /dev/null 2>&1; then
              SUCCESS=true
              break
            fi
            echo "Waiting for repository availability... (Attempt $i/30)"
            sleep 2
          done

          if [ "$SUCCESS" != "true" ]; then
            echo "::error::Repository provisioning timeout - failed to verify repo existence."
            exit 1
          fi

          CURRENT_DEFAULT=$(gh api /repos/KNMentorAGH/$REPO_LOWER -q '.default_branch')
          
          if [ "$CURRENT_DEFAULT" != "main" ]; then
            echo "Renaming default branch from $CURRENT_DEFAULT to main..."
            gh api --method POST /repos/KNMentorAGH/$REPO_LOWER/branches/$CURRENT_DEFAULT/rename \
              -f new_name=main
          fi

          gh repo edit "KNMentorAGH/$REPO_LOWER" \
            --enable-squash-merge \
            --enable-merge-commit=false \
            --enable-rebase-merge=false
        env:
          GITHUB_TOKEN: ${{ secrets.ORG_ADMIN_TOKEN }}

      - name: Assign Team Permissions
        run: |
          REPO_LOWER=$(echo "${{ github.event.inputs.repo_name }}" | tr '[:upper:]' '[:lower:]')
          gh api --method PUT -H "Accept: application/vnd.github+json" \
            /orgs/KNMentorAGH/teams/${{ github.event.inputs.team_name }}/repos/KNMentorAGH/$REPO_LOWER \
            -f permission='maintain'
        env:
          GITHUB_TOKEN: ${{ secrets.ORG_ADMIN_TOKEN }}

      - name: Setup CODEOWNERS
        run: |
          REPO_LOWER=$(echo "${{ github.event.inputs.repo_name }}" | tr '[:upper:]' '[:lower:]')
          CONTENT=$(printf "* @${{ github.event.inputs.project_leader }}" | base64 -w 0)
          
          FILE_SHA=$(gh api /repos/KNMentorAGH/$REPO_LOWER/contents/.github/CODEOWNERS -q '.sha' 2>/dev/null || echo "")
          
          if [ -z "$FILE_SHA" ]; then
            gh api --method PUT -H "Accept: application/vnd.github+json" \
              /repos/KNMentorAGH/$REPO_LOWER/contents/.github/CODEOWNERS \
              -f message="chore: initialize CODEOWNERS [skip ci]" \
              -f content="$CONTENT"
          else
            gh api --method PUT -H "Accept: application/vnd.github+json" \
              /repos/KNMentorAGH/$REPO_LOWER/contents/.github/CODEOWNERS \
              -f message="chore: initialize CODEOWNERS [skip ci]" \
              -f content="$CONTENT" \
              -f sha="$FILE_SHA"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.ORG_ADMIN_TOKEN }}

      - name: Enforce Branch Protection
        run: |
          REPO_LOWER=$(echo "${{ github.event.inputs.repo_name }}" | tr '[:upper:]' '[:lower:]')
          
          # Using heredoc to send a clean JSON payload without escaping issues
          gh api --method PUT /repos/KNMentorAGH/$REPO_LOWER/branches/main/protection \
            --input - <<EOF
          {
            "required_status_checks": {
              "strict": true,
              "contexts": ["check-naming-convention", "format", "build", "test"]
            },
            "enforce_admins": true,
            "required_pull_request_reviews": {
              "dismiss_stale_reviews": true,
              "require_code_owner_reviews": true,
              "required_approving_review_count": 1,
              "require_last_push_approval": false
            },
            "restrictions": null,
            "allow_force_pushes": false,
            "allow_deletions": false,
            "required_linear_history": true,
            "required_conversation_resolution": true
          }
          EOF
        env:
          GITHUB_TOKEN: ${{ secrets.ORG_ADMIN_TOKEN }}

      - name: Cleanup on Failure (Rollback)
        if: failure()
        run: |
          REPO_LOWER=$(echo "${{ github.event.inputs.repo_name }}" | tr '[:upper:]' '[:lower:]')
          
          # Check if repository exists before attempting deletion
          if gh repo view "KNMentorAGH/$REPO_LOWER" > /dev/null 2>&1; then
            echo "::warning::Workflow failed after repository creation. Deleting 'KNMentorAGH/$REPO_LOWER' to avoid orphaned resources."
            gh repo delete "KNMentorAGH/$REPO_LOWER" --yes
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.ORG_ADMIN_TOKEN }}
